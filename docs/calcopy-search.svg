<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Yu Gothic', YuGothic, Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title>検索結果一覧でブックマークレットを実行したときの画面（ダミーデータ）</title>
