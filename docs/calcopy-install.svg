<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Yu Gothic', YuGothic, Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title>ブックマークバーへのインストール手順（ダミー画面）</title>
  <rect width="880" height="260" rx="8" fill="#ffffff" stroke="#dadce0"/>

  <!-- ブックマークバー（ドロップ先） -->
  <path d="M0 8a8 8 0 0 1 8-8h864a8 8 0 0 1 8 8v28H0z" fill="#f8f9fa"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#dadce0"/>
  <text x="18" y="22" font-size="12" fill="#5f6368">社内Wiki</text>
  <text x="86" y="22" font-size="12" fill="#5f6368">経費精算</text>
  <rect x="150" y="6" width="104" height="24" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="202" y="22" font-size="11" fill="#1967d2" text-anchor="middle">ここにドロップ</text>

  <!-- インストールページ -->
  <text x="40" y="86" font-size="17" fill="#1f2328">calcopy</text>
  <text x="40" y="110" font-size="11.5" fill="#5b6470">Google カレンダーの予定をクリップボードにコピーするブックマークレットです。</text>
  <rect x="40" y="132" width="640" height="92" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="64" y="160" width="132" height="40" rx="8" fill="#1a73e8"/>
  <rect x="82" y="173" width="10" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="84.5" y1="172" x2="89.5" y2="172" stroke="#ffffff" stroke-width="2.8"/>
  <text x="102" y="185" font-size="13" fill="#ffffff" font-weight="bold">calcopy</text>
  <text x="220" y="176" font-size="11.5" fill="#5b6470">このボタンをブックマークバーにドラッグ＆ドロップしてください。</text>
  <text x="220" y="196" font-size="11.5" fill="#5b6470">ブックマークバーの表示は Ctrl+Shift+B で切り替えられます。</text>

  <!-- ドラッグの矢印 -->
  <path d="M150 156 C 156 110, 176 66, 194 40" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="196,32 188,42 199,44" fill="#d93025"/>
  <circle cx="140" cy="132" r="13" fill="#d93025"/>
  <text x="140" y="137" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="712" y="170" font-size="12" fill="#d93025">index.html を開いて</text>
  <text x="712" y="188" font-size="12" fill="#d93025">ドラッグするだけ</text>
</svg>
